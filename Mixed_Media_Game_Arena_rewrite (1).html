<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mixed Media Game Arena – SMP Hasanuddin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ok:#22c55e;--no:#ef4444;--ac:#fbbf24;--pk:#ec4899;--cy:#22d3ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Fredoka',system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 15% 10%,#6d28d9 0,transparent 40%),radial-gradient(circle at 85% 90%,#0e7490 0,transparent 40%),linear-gradient(135deg,#1b0b3a,#0b2a5c);background-attachment:fixed}
#app{max-width:880px;margin:0 auto;padding:14px}
.fl{position:fixed;font-size:34px;opacity:.18;animation:fl 9s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translateY(-30px) rotate(20deg)}}
.card{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:18px;backdrop-filter:blur(6px);margin-bottom:12px}
h1{font-size:clamp(28px,7vw,52px);margin:6px 0;background:linear-gradient(90deg,#f472b6,#fbbf24,#22d3ee,#a3e635);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;line-height:1.1}
h2{margin:8px 0;font-size:clamp(18px,4.6vw,26px);line-height:1.3}
.c{text-align:center}.sm{font-size:14px;opacity:.85}
img.hero{width:100%;border-radius:20px;border:3px solid var(--ac);box-shadow:0 0 30px #a855f7}
button{font-family:inherit;cursor:pointer;border:0;border-radius:16px;padding:13px 18px;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ec4899,#8b5cf6);box-shadow:0 5px 0 #4c1d95;transition:transform .1s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #4c1d95}
button.big{width:100%;font-size:21px;margin-top:8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:rgba(255,255,255,.14);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.opt.ok{background:var(--ok)}.opt.no{background:var(--no)}
input{width:100%;padding:12px;border-radius:12px;border:2px solid #a78bfa;background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:17px;margin:4px 0}
.chips button{padding:8px 16px;margin:3px;background:rgba(255,255,255,.15);box-shadow:none}.chips button.on{background:var(--pk)}
.hud{display:flex;justify-content:space-between;gap:8px;font-weight:700;flex-wrap:wrap}
.bar{height:14px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444);transition:width 1s linear}
.em{font-size:64px;text-align:center;line-height:1.1;filter:drop-shadow(0 4px 8px #0008)}
.tp{display:inline-block;background:var(--cy);color:#012;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 button{box-shadow:0 3px 0 rgba(0,0,0,.4);font-size:15px;padding:11px 8px;background:rgba(255,255,255,.16);min-height:56px}
.fb{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:#000a;padding:16px;animation:pop .35s}
.fb div{max-width:440px;border-radius:26px;padding:24px;text-align:center;font-size:16px}
.fb b{display:block;font-size:clamp(30px,9vw,48px);margin-bottom:8px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
table{width:100%;border-collapse:collapse}td,th{padding:8px 5px;text-align:left;border-bottom:1px solid #fff3;font-size:15px}
.st{font-size:30px}
.cf{position:fixed;top:-40px;font-size:28px;animation:cf linear forwards;z-index:10;pointer-events:none}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
#mu{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:20;padding:6px 12px;font-size:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
</style></head><body>
<button id="mu" onclick="tm()">🔊</button><div id="app"></div>
